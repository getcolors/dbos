[project]
name = "package-dbos-blue"
version = "0.1.0"
description = "Blue/Python implementation of the DBOS package"
requires-python = ">=3.11"
dependencies = [
  "blue @ git+https://github.com/getcolors/blue.git@290f313ead5ca162875c33a049c880da017eae09",
  "package-once-blue @ git+https://github.com/getcolors/once.git@a1fe1be7a427dd2e406ff7befd1c43a53e7c3618#subdirectory=blue",
  "colors-compute-blue @ git+https://github.com/getcolors/colors-compute.git@422c3f39d22be93efa703da09eb192490942ede3#subdirectory=blue",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/package_dbos_blue"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
