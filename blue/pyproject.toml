[project]
name = "package-dbos-blue"
version = "0.1.0"
description = "Blue/Python implementation of the DBOS package"
requires-python = ">=3.11"
dependencies = [
    "blue",
    "package-once-blue",
]

[tool.uv.sources]
blue = { git = "https://github.com/getcolors/blue.git", rev = "290f313ead5ca162875c33a049c880da017eae09" }
package-once-blue = { git = "https://github.com/getcolors/once.git", subdirectory = "blue", rev = "38e3cd66674a32fb96605e1b17ae6791086ad5c1" }

# package-once-blue at the ONCE pin above now pins the same blue rev, so this
# override is redundant; it is kept because it is harmless and would make this
# package's blue pin win again were ONCE ever to pin an older one (as it did at
# 6952711, whose 369c5aa made the two git URLs conflict and uv refuse to
# resolve), the way tools.deps lets the top-level green pin win in
# green/deps.edn.
[tool.uv]
override-dependencies = [
    "blue @ git+https://github.com/getcolors/blue.git@290f313ead5ca162875c33a049c880da017eae09",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/package_dbos_blue"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
