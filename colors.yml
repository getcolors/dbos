# Desired state for dbos-digitalocean. Non-secret values only.
# Credentials belong in the gitignored .envrc.private as COLORS_PAR_* variables.
# Never export COLORS_PAR_PROFILE: it selects this deployment's remote state.
#
# Required credentials:
#   DigitalOcean       COLORS_PAR_DO_TOKEN
#   Cloudflare         COLORS_PAR_CLOUDFLARE_API_TOKEN
#   state in R2        COLORS_PAR_R2_ACCESS_KEY_ID
#                      COLORS_PAR_R2_SECRET_ACCESS_KEY
#   PostgreSQL         COLORS_PAR_DBOS_POSTGRES_PASSWORD
#   backups in R2      COLORS_PAR_POSTGRES_BACKUP_R2_ACCESS_KEY_ID
#                      COLORS_PAR_POSTGRES_BACKUP_R2_SECRET_ACCESS_KEY

profile: dbos-example
workdir: .colors

provider-compute: digitalocean
provider-dns: cloudflare
provider-backend: r2

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- DBOS reference application ---------------------------------------------

dbos-host: dbos.example.com
dbos-image: ghcr.io/getcolors/dbos:4.25.14
dbos-version: 4.25.14
dbos-version-source-url: https://www.npmjs.com/package/@dbos-inc/dbos-sdk/v/4.25.14
dbos-version-discovered: 2026-08-15

# DBOS is a production library embedded in this Node service, backed by the
# colocated PostgreSQL instance. Its deprecated admin server remains disabled.
dbos-node-version: 24
dbos-application-name: dbos-reference
dbos-data-dir: /var/lib/dbos
dbos-durable-delay-seconds: 60
dbos-step-max-attempts: 3
dbos-step-initial-retry-seconds: 1
dbos-workflow-retention-days: 30

# PostgreSQL listens only on the Droplet loopback interface. Major version 17
# is intentionally selected for its mature production support window.
postgres-version: 17
postgres-data-dir: /var/lib/postgresql/dbos
postgres-database: dbos
dbos-system-database-pool-size: 10

# Daily encrypted-in-transit PostgreSQL backups are retained independently of
# the Droplet so operator mistakes or disk loss have a documented restore path.
postgres-backup-r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
postgres-backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
postgres-backup-r2-region: auto
postgres-backup-r2-prefix: dbos-example/backups/dbos.example.com
postgres-backup-retention-days: 30
postgres-backup-oncalendar: "*-*-* 02:30:00"

# --- DigitalOcean ------------------------------------------------------------

digitalocean-name: dbos-example
digitalocean-region: ams3
# Four shared vCPUs and 8 GiB RAM leave headroom for PostgreSQL, Node, Caddy,
# deployment services, and restart acceptance checks on the single machine.
digitalocean-size: s-4vcpu-8gb
digitalocean-image: ubuntu-24-04-x64
digitalocean-ssh-authorized-keys: ~/.ssh/id_ed25519.pub
digitalocean-ssh-key-name: vaultwarden-digitalocean
digitalocean-ssh-private-key: ~/.ssh/id_ed25519

# Restrict administrative SSH to the Phase 2 operator's current public IPv4.
digitalocean-ssh-sources:
  - 129.159.242.163/32

# The package must discover the configured region's default VPC at runtime.
# There is deliberately no VPC UUID, VPC CIDR, or VPC resource in desired state.
digitalocean-vpc-mode: default

# --- Public HTTPS ------------------------------------------------------------

cloudflare-zone: dbos.example.com
cloudflare-proxied: false
# Only SSH, HTTP, and HTTPS are public. PostgreSQL and DBOS internal interfaces
# remain private; HTTP is retained for certificate issuance and HTTPS redirect.
digitalocean-http-sources:
  - 0.0.0.0/0
  - "::/0"
digitalocean-https-sources:
  - 0.0.0.0/0
  - "::/0"

# --- R2 state backend --------------------------------------------------------

r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
