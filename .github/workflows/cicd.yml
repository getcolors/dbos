name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
      - run: bb test
        working-directory: green
      - run: bb golden
        working-directory: green
      - run: bun install && bun test && bun run typecheck
        working-directory: red
      - run: uv run pytest
        working-directory: blue
      - run: ./scripts/parity.sh
      - run: ./scripts/launcher.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
        working-directory: application
      - run: npm run typecheck && npm run build && npm test
        working-directory: application
      - run: bash -n container/entrypoint container/backup scripts/acceptance.sh
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/getcolors/dbos:4.25.14
